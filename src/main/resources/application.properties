# ===== 网关本地配置 =====

# 未登记调用方的默认策略：保守配额、仅允许 v1（缺失该条目时代码还会再退化为配额 0）
gateway.callers.default.quota=5
gateway.callers.default.window-millis=60000
gateway.callers.default.versions=v1

# 调用方 premium-a：每 1 秒 3 个请求，同时授权 v1 与 v2（两版本配额各自独立）
gateway.callers.premium-a.quota=3
gateway.callers.premium-a.window-millis=1000
gateway.callers.premium-a.versions=v1,v2

# 调用方 legacy-b：每 1 秒 2 个请求，仅授权 v1
gateway.callers.legacy-b.quota=2
gateway.callers.legacy-b.window-millis=1000
gateway.callers.legacy-b.versions=v1

# 调用方 v2-only-c：仅授权 v2，用于验证版本不兼容拒绝
gateway.callers.v2-only-c.quota=4
gateway.callers.v2-only-c.window-millis=1000
gateway.callers.v2-only-c.versions=v2

# 下游服务：本地内置模拟下游；读/连接超时 1500ms
gateway.downstream.base-url=http://localhost:8080
gateway.downstream.timeout-millis=1500
